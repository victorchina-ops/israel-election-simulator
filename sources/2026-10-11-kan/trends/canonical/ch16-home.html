a298cfe01d5503c9cd39dd6\",\"name\":\"Sidebar\",\"props\":{\"data\":{},\"logoFull\":\"https://ch16israel.vod.immergo.tv/ch16israel/uploaded/c7c1f896-addf-4818-a789-8a3eaa3eef6c.png\",\"logoMin\":\"https://ch16israel.vod.immergo.tv/ch16israel/uploaded/bfbd4781-67a7-437e-8f7e-898a5cbc4ab4.png\",\"logoAspect\":\"1:1\",\"logoSize\":\"large\",\"rtl\":true,\"isFocused\":false,\"hasLocationWidget\":false,\"hasWeatherWidget\":false,\"activeLogoCenter\":true,\"hasBottomIcon\":false,\"backgroundColor\":\"#1c1e4d\",\"colorActive\":\"rgb(227, 6, 19)\",\"navActiveType\":\"colorText\",\"navsAlign\":\"top\",\"navsGap\":\"large\",\"opacity\":\"full\",\"showNav\":true,\"theme\":\"light\",\"size\":\"large\",\"type\":\"gradient\"}}},\"header\":{\"component\":{\"name\":\"Header\",\"props\":{\"hasCustomNavBarDest\":false}}}},\"staticPages\":[{\"title\":\"תנאי שימוש \",\"description\":null,\"type\":\"terms_and_conditions\",\"mediaType\":\"html\",\"link\":\"https://www.ch16.co.il/termsandconditions.html\",\"body\":\"\u003cp\u003e\u003cstrong\u003eתנאי שימוש – ערוץ 16\u003c/strong\u003e\u003c/p\u003e\u003cp\u003eעודכן לאחרונה: ___________\u003c/p\u003e\u003cp\u003e\u003cstrong\u003e1. מבוא ותחולה\u003c/strong\u003e\u003c/p\u003e\u003cp\u003eתנאי שימוש אלה (\\\"התנאים\\\") חלים על השימוש באתר האינטרנט www.ch16.co.il (\\\"האתר\\\") ובאפליקציה ערוץ 16 (\\\"האפליקציה\\\"), המופעלים ומנוהלים על-ידי פלאש גרופ פרודקשנס בע\\\"מ ח.פ 517264891 (להלן: \\\"החברה\\\") (יחד: \\\"הפלטפורמות\\\").\u003c/p\u003e\u003cp\u003eהשימוש בפלטפורמות, לרבות גלישה, קריאת תכנים, הרשמה, רכישת מנוי ומסירת תכנים לפרסום, מהווה הסכמה מלאה ובלתי מסויגת לתנאים אלה ולמדיניות הפרטיות המפורסמת בפלטפורמות. המשך השימוש בפלטפורמות לאחר פרסום תנאים אלה מהווה הסכמתך המלאה להם. אם אינך מסכים לתנאים, עליך להימנע מכל שימוש נוסף בפלטפורמות.‏\u003c/p\u003e\u003cp\u003eתנאי שימוש אלה מנוסחים בלשון זכר לצרכי נוחות בלבד ומתייחסים לכל המינים. הכותרות הן לצרכי נוחות בלבד ואין להתחשב בהן לצורך פירוש ההוראות.‏\u003c/p\u003e\u003cp\u003eייתכנו שירותים ספציפיים בפלטפורמות הכפופים לתנאים נוספים ו/או ייעודיים. במקרה של סתירה בין תנאי שימוש כלליים אלה לבין תנאים ייעודיים - יגברו התנאים הייעודיים ביחס לאותו שירות.\u003c/p\u003e\u003cp\u003e\u003cstrong\u003e2. הגדרות\u003c/strong\u003e\u003c/p\u003e\u003cp\u003e\\\"תוכן\\\" / \\\"תכנים\\\" – מידע מכל מין וסוג, לרבות כתבות, ידיעות, מאמרים, טורים, דעות, תצלומים, איורים, גרפיקה, סרטוני וידאו, קבצי קול, פודקאסטים, נתונים, קוד מחשב, ממשקים, עיצובים, אייקונים, וכן עיצובם, עיבודם, עריכתם ודרך הצגתם, וכל שילוב שלהם.‏\u003c/p\u003e\u003cp\u003e\\\"משתמש\\\" – כל אדם העושה שימוש בפלטפורמות, לרבות גולש ומשתמש רשום.‏\u003c/p\u003e\u003cp\u003e\u003cstrong\u003e3. כשרות לשימוש ותאימות טכנית\u003c/strong\u003e\u003c/p\u003e\u003cp\u003eהשימוש בפלטפורמות מותר לכל אדם. שירותים מסוימים, כגון תחרויות, פעילויות ייעודיות, שירותים בתשלום ותכנים מסוימים, מיועדים לבגירים בלבד, דהיינו לאנשים מעל גיל 18. בעצם השתתפותך בפעילויות כאמור, הנך מצהיר ומאשר כי הנך בגיר.‏\u003c/p\u003e\u003cp\u003eהגישה לאפליקציה תתאפשר ממכשירי סמארטפון ומחשבי שולחן (Desktop) התומכים בגרסה מעודכנת של מערכות ההפעלה iOS ו-Android. החברה אינה מתחייבת כי הגישה תתאפשר ממכשירים אחרים ו/או גרסאות תוכנה שאינן נתמכות, ולחברה הזכות להפסיק תמיכה בגרסאות קיימות בהתאם להתפתחות טכנולוגית.\u003c/p\u003e\u003cp\u003eהחברה רשאית, לפי שיקול דעתה הבלעדי, לסרב לאפשר שימוש בפלטפורמות, לחסום גישה, לבטל רישום משתמש, או לנקוט כל פעולה אחרת, ובכלל זה בשל הפרת תנאי שימוש אלה, ביצוע מעשה בלתי חוקי, מסירת פרטים כוזבים, פגיעה בחברה או בצדדים שלישיים, אי-שימוש בשירות לתקופה ממושכת, קיום חוב כספי לחברה שלא נפרע, או כל טעם סביר אחר לפי שיקול דעתה.\u003c/p\u003e\u003cp\u003e\u003cstrong\u003e4. שימוש בפלטפורמות – כללי\u003c/strong\u003e\u003c/p\u003e\u003cp\u003eהגישה לפלטפורמות והשימוש בהן מותרים לשימוש אישי ופרטי בלבד. אין לעשות שימוש מסחרי בתכנים או בשירותים הכלולים בפלטפורמות, אלא אם קיבלת הסכמה מפורשת, מראש ובכתב מאת החברה.‏\u003c/p\u003e\u003cp\u003eהחברה אינה מתחייבת כי תכנים המשודרים בפלטפורמות ישודרו במלואם, ולא תתחייב להעלותם במועד ספציפי. החברה רשאית להפסיק, להסיר או לשנות תכנים בכל עת לפי שיקול דעתה הבלעדי וללא הודעה מוקדמת.‏\u003c/p\u003e\u003cp\u003e\u003cstrong\u003e5. שימוש אסור\u003c/strong\u003e\u003c/p\u003e\u003cp\u003eחל איסור להשתמש בפלטפורמות ובתכנים לכל מטרה בלתי חוקית או לכל מטרה האסורה בתנאי שימוש אלה. מבלי לגרוע מהאמור, אינך רשאי, בין בעצמך ובין באמצעות אחרים:‏\u003c/p\u003e\u003cp\u003eלהשתמש בפלטפורמות באופן העלול להזיק, לשתק, לגרום עומס-יתר, לפגוע בהן, ברשתות תקשורת או בציוד תקשורת, או להפריע לשימוש של גורמים אחרים;‏\u003c/p\u003e\u003cp\u003eלנסות לקבל גישה ללא הרשאה לפלטפורמות, לחשבונות של אחרים, למערכות מחשבים או לרשתות המחוברות לפלטפורמות, בכל אמצעי שהוא;‏\u003c/p\u003e\u003cp\u003eלהשיג תכנים או מידע באמצעים שלא הועמדו לרשותך במכוון על-ידי החברה;‏\u003c/p\u003e\u003cp\u003eליצור לקטים, אוספים או מאגרים שיכילו תכנים מהפלטפורמות;‏\u003c/p\u003e\u003cp\u003eלהתחזות לאדם, לגוף, לעיתונאי או לכל גורם אחר, או להטעות בדרך אחרת בדבר זהותך או מקור העלאת התוכן;‏\u003c/p\u003e\u003cp\u003eלהציג תכנים מהפלטפורמות בתוך מסגרת (Frame), גלויה או סמויה, ללא הסכמת החברה;‏\u003c/p\u003e\u003cp\u003eלפרסם תכנים שקריים, מטעים, משמיצים, פוגעי-פרטיות, מאיימים, גזעניים, מעודדי אלימות, המהווים לשון הרע, או אחרים המנוגדים לדין;‏\u003c/p\u003e\u003cp\u003eלעשות שימוש בתכנים באופן המשנה את עיצובם, מסיר מהם פרסומות, או פוגע ברכיבי הגנה טכנולוגיים.\u003c/p\u003e\u003cp\u003eסימני המסחר של החברה וכל הסימנים האחרים המצויים בפלטפורמות הם סימני מסחר רשומים. אינך רשאי לעשות כל פעולה העלולה לפגוע בסימני המסחר.\u003c/p\u003e\u003cp\u003e\u003cstrong\u003e6. איסור שימוש אוטומטי, סריקה ובינה מלאכותית\u003c/strong\u003e\u003c/p\u003e\u003cp\u003eאין להפעיל ביחס לפלטפורמות כל יישום מחשב, סקריפט או אמצעי אוטומטי, לרבות תוכנות מסוג Crawlers, Robots, Bots, Spiders, Scrapers וכדומה, לשם חיפוש, סריקה, העתקה, אחזור אוטומטי, איסוף, אינדוקס (Indexing) או שאיבת תכנים מהפלטפורמות, בין לצרכים מסחריים ובין לכל צורך אחר, ללא קבלת הסכמה מפורשת, פרטנית ומוקדמת בכתב מאת החברה.‏\u003c/p\u003e\u003cp\u003eחל איסור מוחלט לעשות שימוש בתכני הפלטפורמות, כולם או חלקם, לצורך אימון, כוונון, אימות, שיפור או עיבוד מודלים מבוססי בינה מלאכותית (\\\"AI\\\"), לרבות יצירת תוכן סינתטי (Synthetic Content), חדשות מזויפות (Fake News), התחזות (Impersonation), כריית נתונים (Data Mining), סריקה אוטומטית (Web Scraping), ואינדוקס תכנים לצרכי פיתוח מודלים, או שימוש לצרכי בנייה, אימון, תיקוף, שיפור או עיבוד של מודלים מבוססי AI.‏ באופן מפורש, חל איסור על גישה, סריקה, שימוש או עיבוד תכני הפלטפורמות במסגרת פרויקטים או תוכניות מסוג Model Context Program (\\\"MCP\\\") ו/או במסגרת שימושים דומים של פלטפורמות בינה מלאכותית (לרבות OpenAI, Anthropic, Google DeepMind, Microsoft, Meta AI ו/או כל גורם דומה), אלא אם התקבל אישור מפורש, פרטני ובכתב מאת החברה במסגרת הסכם התקשרות ברור ומפורט המסדיר את תנאי השימוש.‏\u003c/p\u003e\u003cp\u003eכל גורם המעוניין לעשות שימוש בתכנים כאמור, לרבות שימוש באמצעות MCP, מחויב ליצור קשר עם החברה מראש לשם קבלת אישור והסדרת תנאים מפורשים ומחייבים. שימוש לא מאושר ייחשב להפרה חמורה של זכויות החברה ויבסס עילה לנקיטת הליכים משפטיים.\u003c/p\u003e\u003cp\u003e\u003cstrong\u003e7. קניין רוחני\u003c/strong\u003e\u003c/p\u003e\u003cp\u003eכל זכויות היוצרים, סימני המסחר, זכויות הפטנטים וכל זכות קניין רוחני אחרת בפלטפורמות ובתכנים הכלולים בהן (למעט תכנים שנמסרו לפרסום על-ידי משתמשים ו/או מפרסמים) הינן של החברה בלבד, או של צדדים שלישיים שהרשו לחברה להשתמש בהם, ומוגנות בהתאם לחוקי מדינת ישראל, אמנות בינלאומיות וחוקי זכויות יוצרים של מדינות אחרות.‏\u003c/p\u003e\u003cp\u003eאין להעתיק, להפיץ, להציג בפומבי, לבצע בפומבי, להעביר לציבור, לשנות, לעבד, ליצור יצירות נגזרות, לתרגם, לסכם, למכור, להשכיר או לאחסן כל חלק מהתכנים, בין על-ידיך ובין באמצעות צד שלישי, בכל דרך ואמצעי, ידניים, אוטומטיים, אלקטרוניים, מכאניים, אופטיים, צילום, הקלטה, כריית נתונים (Data Mining), סריקה אוטומטית (Web Scraping), או טכנולוגיות אחרות, ללא הסכמה מפורשת של החברה בכתב ומראש.‏\u003c/p\u003e\u003cp\u003eסימני המסחר, שמות, לוגואים, עיצובים ופרסומות של מפרסמים וצדדים שלישיים הינם קניינם הבלעדי של אותם גורמים ואין לעשות בהם שימוש ללא הסכמתם בכתב ומראש.‏\u003c/p\u003e\u003cp\u003e\u003cstrong\u003e8. תכנים שנמסרו לפרסום על-ידי משתמשים (UGC)\u003c/strong\u003e\u003c/p\u003e\u003cp\u003eהפלטפורמות מאפשרות למשתמשים להעלות ולפרסם תכנים באזורים המיועדים לכך, לרבות תגובות לכתבות, פורומים, קהילות, צ'אטים ושירותים אחרים המאפשרים הזנת תכנים על-ידי המשתמשים (\\\"תכנים שנמסרו על-ידי משתמש\\\"). עצם העלאת תוכן מהווה אישור מצדך כי התוכן עומד בתנאי שימוש אלה, כי אינו סודי וכי אין בו כדי לפגוע בצדדים שלישיים.‏\u003c/p\u003e\u003cp\u003eאחריות התוכן שהעלית חלה עליך בלבד. החברה אינה מחויבת לפקח על תכנים שמעלים משתמשים, אך שומרת לעצמה את הזכות לערוך, להסיר, לסרב לפרסם או לחסום כל תוכן, לפי שיקול דעתה הבלעדי, ובפרט תכנים הנמנים עם אחד או יותר מאלה:\u003c/p\u003e\u003cp\u003eתכנים האסורים לפרסום לפי הדין, לרבות לשון הרע, פגיעה בפרטיות ודברי נאצה;‏\u003c/p\u003e\u003cp\u003eתוכן פורנוגרפי או בעל אופי מיני בוטה;‏\u003c/p\u003e\u003cp\u003eתוכן הנוגע לקטינים ומזהה אותם;\u003c/p\u003e\u003cp\u003eתכנים שקריים, מטעים או מסולפים;\u003c/p\u003e\u003cp\u003eתכנים מסחריים שלא הוסכמו מראש;‏\u003c/p\u003e\u003cp\u003eתוכנות עוינות (וירוסים, סוסים טרויאנים, תולעים וכד');\u003c/p\u003e\u003cp\u003eכל תוכן בעל אופי טורדני, מעליב, עוין, מאיים, גס-רוח, גזעני, מעודד אלימות, או הנוגד את הוראות הדין;\u003c/p\u003e\u003cp\u003eתכנים שהגישה אליהם חסומה באמצעות סיסמה.‏\u003c/p\u003e\u003cp\u003eבמסירת תכנים לפרסום בפלטפורמות, אתה מעניק לחברה רישיון חינם, כלל-עולמי, בלתי מוגבל בזמן ובלתי חוזר, להשתמש בתכנים בכל דרך, לרבות העתקה, שכפול, הפצה, שידור, עריכה, תרגום ופרסום, וכן לתת רישיון משנה לצדדים שלישיים לפי שיקול דעת החברה. לא תשולם לך כל תמורה עבור שימוש בתכנים שהועלו על-ידיך.‏\u003c/p\u003e\u003cp\u003eבעת העלאת תכנים, הנך מצהיר כי הנך הבעלים של זכויות היוצרים בהם, או שקיבלת הרשאה מפורשת מבעל הזכויות לעשות בהם שימוש בפלטפורמות. הנך מתחייב לשפות את החברה בגין כל טענה, תביעה, נזק או הוצאה (לרבות שכ\\\"ט עו\\\"ד) הנובעים מפרסום תכנים שהועלו על-ידיך.‏\u003c/p\u003e\u003cp\u003e\u003cstrong\u003e9. דיוור ישיר[שימו לב לוודא כי אפשרות ההסרה מרישום אכן עובדת, וכן יש לציין בבאנר לרישום כי הם נותנים את הסכמתם לקבלת דיוור ישיר]\u003c/strong\u003e\u003c/p\u003e\u003cp\u003eככל שתמסור לחברה את פרטיך לצורך קבלת עדכונים, ניוזלטרים, מידע שיווקי או דברי פרסומת, או ככל שתאשר קבלת דיוורים כאמור במסגרת ההרשמה או השימוש בפלטפורמות, החברה תהיה רשאית לשלוח אליך, בעצמה ו/או באמצעות מי מטעמה, מידע שיווקי, הצעות, הטבות, מבצעים ודברי פרסומת, לרבות דיוור ישיר כהגדרתו בחוק הגנת הפרטיות, התשמ\\\"א-1981, ודבר פרסומת כהגדרתו בחוק התקשורת (בזק ושידורים), התשמ\\\"ב-1982 (להלן יחד: \\\"דיוור ישיר\\\"), לרבות באמצעות דוא\\\"ל, מסרון, הודעת Push, ו/או בכל אמצעי תקשורת אחר, והכל בכפוף להוראות הדין ולהסכמות הנדרשות לפיו. ככל שתימסר לחברה גם כתובת טלפון, עשויה החברה לפנות אליך גם בדרך זו, וזאת גם אם הנך רשום במאגר \\\"אל תתקשר אלי\\\" או מסוג זה, ובכפוף להוראות הדין.\u003c/p\u003e\u003cp\u003eבכל עת תוכל לבטל את הסכמתך ולבקש להפסיק לקבל דיוור ישיר כאמור, בין באמצעות קישור ההסרה הכלול בדיוור ובין באמצעות פנייה לחברה בפרטי הקשר המפורטים בסעיף יצירת קשר להלן. הפסקת דיוור פרסומי לא תגרע מזכותה של החברה לשלוח לך הודעות תפעוליות, שירותיות או הודעות הנדרשות לצורך ניהול הקשר עמך או אספקת השירותים.‏\u003c/p\u003e\u003cp\u003e\u003cstrong\u003e10. חשבון משתמש רשום\u003c/strong\u003e\u003c/p\u003e\u003cp\u003eהחברה מאפשרת למשתמשים להירשם וליצור חשבון אישי בפלטפורמות, כאשר ייתכנו שירותים מסוימים בפלטפורמות המחייבים הרשמה ויצירת חשבון אישי (\\\"משתמש רשום\\\"). בעת ההרשמה תידרש למסור פרטים כגון שם וכתובת דוא\\\"ל, ולבחור סיסמה אישית. הנך אחראי לשמור על סודיות פרטי הגישה לחשבונך ולהודיע לחברה מיידית על כל חשש לשימוש בלתי מורשה בחשבונך. [אנא אשרו]\u003c/p\u003e\u003cp\u003eהחברה רשאית, לפי שיקול דעתה הבלעדי, להשעות או לבטל חשבון משתמש רשום בשל הפרת תנאי שימוש אלה, מסירת פרטים כוזבים, פגיעה בחברה או בצדדים שלישיים, או כל טעם סביר.\u003c/p\u003e\u003cp\u003e\u003cstrong\u003e11. תכנים מסחריים ופרסומות\u003c/strong\u003e\u003c/p\u003e\u003cp\u003eהפלטפורמות עשויות לכלול תכנים מסחריים, לרבות פרסומות, מודעות ותכנים שיווקיים, הנמסרים לפרסום מטעם מפרסמים שונים. פרסום התכנים המסחריים אינו מהווה המלצה של החברה לרכוש את המוצרים או השירותים המוצעים בהם. האחריות לתכנים המסחריים חלה על המפרסמים בלבד; החברה אינה בודקת, מוודאת או עורכת את תוכן הפרסומים או אמיתותם.‏\u003c/p\u003e\u003cp\u003eכל עסקה הנוצרת בעקבות תכנים מסחריים בפלטפורמות תסוכם ישירות בין המשתמש לבין המפרסם. החברה אינה צד לעסקה כזו ולא תישא בכל אחריות בקשר אליה.‏\u003c/p\u003e\u003cp\u003eהפלטפורמות עשויות לכלול תכנים שיווקיים שהופקו בשיתוף מימוני של גורמים מסחריים (\\\"תוכן ממומן\\\" / \\\"תוכן שיווקי\\\"). תכנים כאמור יסומנו בהתאם לדרישות הדין, לרבות בכיתוב \\\"תוכן בשיתוף עם [שם הגורם המסחרי]\\\", וכן בסמליל ייעודי בהתאם לנהלי הגילוי הנאות המקובלים.\u003c/p\u003e\u003cp\u003e\u003cstrong\u003e12. קישורים לאתרים חיצוניים\u003c/strong\u003e\u003c/p\u003e\u003cp\u003eהפלטפורמות עשויות לכלול קישורים לאתרים ולתכנים חיצוניים שאינם בשליטת החברה. עצם קיומם של קישורים אלה אינו מעיד על הסכמת החברה לתוכנם ואינו מהווה ערובה לאמינותם, עדכניותם, חוקיותם או נוהגיהם בתחום הפרטיות. הביקור באתרים חיצוניים הוא על אחריותך הבלעדית. החברה רשאית לשנות, להוסיף ולהסיר קישורים בכל עת לפי שיקול דעתה הבלעדי.‏\u003c/p\u003e\u003cp\u003eמותר לקשר לעמוד הבית של האתר בלבד. אין לקשר לתכנים פנימיים (\\\"קישור עמוק\\\") ואין להציג תכנים מהפלטפורמות בתוך מסגרת (Frame) ללא הסכמה מפורשת בכתב מאת החברה. אין לקשר לפלטפורמות מאתרים המכילים תכנים פורנוגרפיים, גזעניים, בלתי חוקיים, או תכנים המנוגדים לדין.\u003c/p\u003e\u003cp\u003eאין להטמיע סרטוני וידאו (Embedding) מהפלטפורמות ללא אישור מראש ובכתב של החברה, ובכלל זה אין להטמיעם באתרים המכילים תכנים פורנוגרפיים, גזעניים, בלתי חוקיים, או שהטמעת הסרטון תהווה הפרת זכות יוצרים מוסרית של צד שלישי.‏\u003c/p\u003e\u003cp\u003eמנוע החיפוש באתר עשוי להיות מנוהל על-ידי צד שלישי ומשקף שיקול דעת של עורכיו ו/או אלגוריתם. אין לייחס לתוצאות החיפוש תוקף מחייב, ואין בהצבת מנוע החיפוש משום המלצה להסתמך על תוצאותיו.‏\u003c/p\u003e\u003cp\u003e\u003cstrong\u003e13. אחריות החברה\u003c/strong\u003e\u003c/p\u003e\u003cp\u003eהתכנים והשירותים בפלטפורמות ניתנים לשימוש \\\"כפי שהם\\\" (AS IS) ו\\\"ככל שיהיו זמינים\\\" (AS AVAILABLE). החברה אינה מציגה מצג כלשהו לגבי התאמה, אמינות, דיוק, עדכניות, שלמות או היעדר וירוסים. השימוש בפלטפורמות ייעשה על אחריותך הבלעדית.‏\u003c/p\u003e\u003cp\u003eאין להסתמך על התכנים המתפרסמים בפלטפורמות כייעוץ מקצועי מכל סוג שהוא — משפטי, רפואי, פיננסי, השקעות או אחר. תכנים אלה אינם תחליף לייעוץ מקצועי מותאם. כל החלטה בדבר השימוש בתכנים תיעשה על אחריותך הבלעדית.\u003c/p\u003e\u003cp\u003eהחברה אינה אחראית לכל נזק ישיר, עקיף, מקרי, תוצאתי או עונשי שייגרם כתוצאה מהשימוש בפלטפורמות, מהסתמכות על התכנים, מאי-זמינות השירות, מגישה בלתי מורשית, מווירוסים, מתקלות טכניות, או מכל סיבה אחרת, וזאת במידה המרבית המותרת על-פי הדין.‏\u003c/p\u003e\u003cp\u003eהחברה אינה נושאת באחריות לכל תוכן או התנהגות מאיימים, משמיצים, פוגעים, מגונים או לא חוקיים של גורמים אחרים, לרבות משתמשים, מפרסמים וצדדים שלישיים.‏\u003c/p\u003e\u003cp\u003eהחברה אינה מתחייבת כי הפלטפורמות יפעלו ללא הפרעות, יהיו נקיות מווירוסים, או שתכנים בהן יהיו מדויקים ועדכניים בכל עת.\u003c/p\u003e\u003cp\u003e\u003cstrong\u003e14. שינויים בפלטפורמות ובתנאי השימוש\u003c/strong\u003e\u003c/p\u003e\u003cp\u003eהחברה רשאית לשנות את תנאי השימוש בכל עת, לפי שיקול דעתה הבלעדי וללא צורך במסירת הודעה מוקדמת. הנוסח המעודכן המפורסם בפלטפורמות הוא המחייב בכל עת. המשך שימוש בפלטפורמות לאחר פרסום שינויים מהווה הסכמה לתנאים המעודכנים.‏\u003c/p\u003e\u003cp\u003eהחברה רשאית לשנות, לעדכן, להוסיף או להפסיק שירותים בפלטפורמות בכל עת, ללא הודעה מוקדמת. עם הפסקת שירות מסוים, תפרסם החברה הודעה זמן סביר מראש, ככל שניתן.‏\u003c/p\u003e\u003cp\u003e\u003cstrong\u003e15. מדיניות פרטיות ואבטחת מידע\u003c/strong\u003e\u003c/p\u003e\u003cp\u003eהשימוש בפלטפורמות כפוף למדיניות הפרטיות של החברה, המהווה חלק בלתי נפרד מתנאי שימוש אלה וניתנת לעיון בפלטפורמות בכל עת [קישור: ___________]. מדיניות הפרטיות מפרטת את אופן איסוף המידע, עיבודו, אחסונו, העברתו לצדדים שלישיים וזכויות המשתמש ביחס למידע שנאסף עליו.\u003c/p\u003e\u003cp\u003eהחברה נוקטת אמצעי אבטחה סבירים להגנה על מידע המשתמשים, בהתאם לתקנות הגנת הפרטיות (אבטחת מידע), התשע\\\"ז-2017. עם זאת, החברה אינה יכולה להבטיח כי מערכותיה יהיו חסינות לחלוטין מפני גישה בלתי מורשית.‏\u003c/p\u003e\u003cp\u003e\u003cstrong\u003e16. שיפוי\u003c/strong\u003e\u003c/p\u003e\u003cp\u003eהנך מתחייב לשפות את החברה, עובדיה, מנהליה ומי מטעמה בגין כל נזק, הפסד, אבדן רווח, תשלום או הוצאה (לרבות שכ\\\"ט עו\\\"ד והוצאות משפט) שייגרמו להם עקב: (1) הפרת תנאי שימוש אלה מצדך; (2) תכנים שמסרת לפרסום בפלטפורמות;‏ (3) קישורים שביצעת לפלטפורמות;‏ ו/או (4) כל פסק דין או החלטה של רשות שיפוטית שיחייב את החברה בפיצוי כתוצאה מהאמור.‏\u003c/p\u003e\u003cp\u003e\u003cstrong\u003e17. נגישות\u003c/strong\u003e\u003c/p\u003e\u003cp\u003eהחברה פועלת לנגישות הפלטפורמות בהתאם להוראות חוק שוויון זכויות לאנשים עם מוגבלות, התשנ\\\"ח-1998, ותקנות הנגישות הרלוונטיות. הצהרת הנגישות המלאה של החברה מפורסמת בפלטפורמות וניתנת לעיון בכל עת [קישור: ____________]. לפניות בנושא נגישות ניתן לפנות לרכז הנגישות של החברה בפרטי הקשר המפורטים בהצהרת הנגישות ו/או בסעיף יצירת קשר להלן.\u003c/p\u003e\u003cp\u003e\u003cstrong\u003e18. רישומי החברה\u003c/strong\u003e\u003c/p\u003e\u003cp\u003eרישומי החברה הממוחשבים יהוו ראיה לכאורה לנכונות הנתונים הכלולים בהם ולפעולות שבוצעו, לרבות בגין שימוש בשירותים, ביצוע תשלומים, מסירת תכנים, כניסה לפלטפורמות וכל אינטראקציה אחרת.\u003c/p\u003e\u003cp\u003e\u003cstrong\u003e19. הוראות כלליות\u003c/strong\u003e\u003c/p\u003e\u003cp\u003eתנאי שימוש אלה, יחד עם מדיניות הפרטיות ותנאים נוספים המצורפים, מהווים את ההסכם המלא בין המשתמש לבין החברה ביחס לשימוש בפלטפורמות, וגוברים על כל הסכם, הצעה או מצג שניתנו בעבר.\u003c/p\u003e\u003cp\u003eויתור של החברה על זכות כלשהי אינו מהווה ויתור מתמשך.‏\u003c/p\u003e\u003cp\u003eאם וככל שייקבע כי הוראה מהוראות תנאי שימוש אלה בלתי חוקית או בלתי תקפה, לא יבטל הדבר את יתר הוראות התנאים.\u003c/p\u003e\u003cp\u003eכותרות הסעיפים הן לשם הנוחות בלבד ואין להתחשב בהן לצורך פירוש ההוראות.\u003c/p\u003e\u003cp\u003eאם אתה סבור כי פורסם בפלטפורמות תוכן הפוגע בך או מפר את זכויותיך, אנא פנה אלינו בציון: מהות הפגיעה הנטענת; זיהוי החומר הפוגע; פרטיך האישיים ליצירת קשר; הצהרה כי פנייתך נעשית בתום לב. החברה תשתדל לטפל בפנייתך בהקדם האפשרי.\u003c/p\u003e\u003cp\u003eעל תנאי שימוש אלה ועל כל מחלוקת הנובעת מהם יחולו אך ורק דיני מדינת ישראל. לבתי המשפט המוסמכים בעיר תל אביב-יפו תהיה סמכות שיפוט בלעדית לדון בכל מחלוקת הנובעת מתנאי שימוש אלה או הקשורה אליהם.\u003c/p\u003e\u003cp\u003e\u003cstrong\u003e20. יצירת קשר\u003c/strong\u003e\u003c/p\u003e\u003cp\u003eלכל פנייה, שאלה, תלונה או בקשה הנוגעת לפלטפורמות ולתכנים בהן, ניתן לפנות לחברה באמצעות כתובת הדוא\\\"ל: support@ch16.co.il\u003c/p\u003e\"},{\"title\":\"מדיניות פרטיות\",\"description\":null,\"type\":\"privacy_policy\",\"mediaType\":\"html\",\"link\":\"https://www.ch16.co.il/privacypolicy.html\",\"body\":\"\u003cp\u003e\u003cstrong\u003eמדיניות פרטיות – ערוץ 16\u003c/strong\u003e\u003c/p\u003e\u003cp\u003eעודכן לאחרונה: [___________]\u003c/p\u003e\u003cp\u003e\u003cstrong\u003e1. כללי\u003c/strong\u003e\u003c/p\u003e\u003cp\u003eפלאש גרופ פרודקשנס בע\\\"מ ח.פ. 517264891 (להלן: \\\"החברה\\\") מכבדת את פרטיות המשתמשים באתר www.ch16.co.il ובאפליקציה ערוץ 16, וכן בכל פלטפורמה, שירות, ערוץ תוכן, ניוזלטר, אזור אישי, שירות הרשמה, שירות פרימיום ויישום דיגיטלי נוסף המופעלים מטעמה (יחד: \\\"הפלטפורמות\\\").‏\u003c/p\u003e\u003cp\u003eמדיניות פרטיות זו (להלן: \\\"המדיניות\\\") נועדה לפרט, בין היתר, את סוגי המידע שהחברה עשויה לאסוף אודות המשתמשים, את האופן שבו המידע נאסף, המטרות שלשמן הוא נשמר ומעובד, המקרים שבהם הוא עשוי להיות מועבר לצדדים שלישיים, וכן את הזכויות העומדות למשתמשים ביחס למידע האישי הנוגע אליהם.\u003c/p\u003e\u003cp\u003eמדיניות זו מהווה חלק בלתי נפרד מתנאי השימוש של הפלטפורמות, ויש לקרוא אותה יחד עם תנאי השימוש וכל תנאי נוסף החל על שירותים מסוימים. השימוש בפלטפורמות מעיד על הסכמתך לאמור במדיניות זו. אם אינך מסכים לה, כולו או חלקו, עליך להימנע משימוש בפלטפורמות.\u003c/p\u003e\u003cp\u003eמובהר כי אין עליך חובה חוקית למסור לחברה מידע אישי; עם זאת, ייתכן שללא מסירת מידע מסוים לא תוכל החברה לאפשר לך שימוש בחלק מהשירותים, להשלים הרשמה, לקבל מענה לפנייה, לבצע רכישה, להירשם למנוי או לעשות שימוש בשירותים מסוימים המוצעים בפלטפורמות.‏\u003c/p\u003e\u003cp\u003eהמדיניות מנוסחת בלשון זכר מטעמי נוחות בלבד, אך היא מיועדת כמובן לכלל המגדרים.‏\u003c/p\u003e\u003cp\u003e\u003cstrong\u003e2. איזה מידע אנחנו עשויים לאסוף\u003c/strong\u003e\u003c/p\u003e\u003cp\u003eהחברה עשויה לאסוף מידע שאתה מוסר באופן יזום, וכן מידע שנאסף באופן אוטומטי במהלך השימוש בפלטפורמות.\u003c/p\u003e\u003cp\u003eהמידע שאתה מוסר ביוזמתך עשוי לכלול, לפי העניין, שם פרטי ושם משפחה, כתובת דואר אלקטרוני, מספר טלפון, כתובת, פרטי התחברות, פרטי מנוי, פרטי פנייה לשירות הלקוחות, תוכן פניות שתשלח, מידע שתמסור במסגרת טפסים, הרשמה לניוזלטרים, השתתפות בפעילויות, תגובות לכתבות, שליחת תכנים, או כל מידע נוסף שתבחר למסור במסגרת השימוש בפלטפורמות.‏\u003c/p\u003e\u003cp\u003eבנוסף, במהלך השימוש בפלטפורמות עשוי להיאסף מידע טכני ותפעולי, לרבות כתובת IP, סוג הדפדפן, סוג המכשיר, מערכת ההפעלה, מזהי מכשיר, שפת הדפדפן, נתוני שימוש וגלישה, מועדי גישה, משך שימוש, דפים ותכנים שנצפו, פעולות שבוצעו בפלטפורמות, אינטראקציה עם תכנים, וכן מידע נוסף הנאסף באמצעים טכנולוגיים מקובלים.\u003c/p\u003e\u003cp\u003eככל שהפלטפורמות כוללות שירותים המחייבים הרשמה, מנוי, יצירת חשבון, רכישת שירותים או שליחת תכנים, ייתכן שתידרש למסור פרטים נוספים הדרושים לצורך תפעול השירות הרלוונטי.\u003c/p\u003e\u003cp\u003eככל שהפלטפורמות כוללות שירותים המאפשרים התאמת תכנים לפי מיקום גיאוגרפי, עשויה החברה לאסוף מידע על מיקומך, בהתאם להרשאות שתעניק למכשיר הקצה שברשותך. מידע כאמור ישמש לצורך הצגת תכנים, שירותים ופרסומות המותאמים למיקומך, ככל שהדבר רלוונטי לאופי השירות. בכל עת תוכל לבטל הרשאה זו באמצעות הגדרות מכשיר הקצה שברשותך. מובהר כי ייתכן שחלק מהשירותים לא יהיו זמינים ככל שלא תינתן הרשאת מיקום, או ככל שהפלטפורמה תזהה שאינך נמצא בישראל.\u003c/p\u003e\u003cp\u003e\u003cstrong\u003e3. מידע שמתקבל מצדדים שלישיים\u003c/strong\u003e\u003c/p\u003e\u003cp\u003eבמקרים מסוימים החברה עשויה לקבל מידע אודותיך גם ממקורות חיצוניים, לרבות מצדדים שלישיים שעמם יש לה קשרי פעילות, ספקי שירותים, שותפים עסקיים, או גורמים אחרים המעבירים מידע בהתאם להוראות הדין. מידע כאמור עשוי לכלול פרטי קשר, מידע המאמת את זהותך, או מידע אחר הרלוונטי לצורך אספקת השירותים. החברה תעשה שימוש במידע שהתקבל מצדדים שלישיים בהתאם למדיניות פרטיות זו ולהוראות הדין. מובהר כי השימוש בשירותים של צדדים שלישיים כפוף לתנאי השימוש ולמדיניות הפרטיות שלהם, והחברה אינה אחראית לנוהלי הפרטיות של אותם צדדים.\u003c/p\u003e\u003cp\u003e\u003cstrong\u003e4. מטרות השימוש במידע\u003c/strong\u003e\u003c/p\u003e\u003cp\u003eהחברה עשויה להשתמש במידע שנאסף אודותיך, בין היתר, כדי לאפשר את תפעול הפלטפורמות והשירותים המוצעים בהן; לנהל הרשמה, התחברות, אזור אישי ומנויים; לספק שירות לקוחות ומענה לפניות; לשפר, לפתח ולהתאים את הפלטפורמות, התכנים והשירותים; לנתח את אופן השימוש בפלטפורמות; לשמור על תקינותן, אמינותן ואבטחתן; למנוע תרמית, שימוש לרעה או פעילות בלתי חוקית; לעמוד בדרישות הדין; וכן כדי ליצור עמך קשר בנוגע לשירותים, לעדכונים, להודעות תפעוליות ולתכנים שייתכן שיעניינו אותך.\u003c/p\u003e\u003cp\u003eבנוסף, ובכפוף להוראות הדין ולהסכמות הנדרשות, החברה עשויה לעשות שימוש במידע לצורכי דיוור ישיר, משלוח ניוזלטרים, עדכונים, הצעות, הטבות, מבצעים, תוכן שיווקי או פרסומי, וכן לצורך התאמה טובה יותר של תכנים, שירותים, פרסומים והצעות להעדפותיך ולמאפייני השימוש שלך.\u003c/p\u003e\u003cp\u003eככל שהשימוש בפלטפורמות כולל אפליקציה, ייתכן שהחברה תשלח הודעות מתפרצות למכשיר הקצה שלך, בכפוף לאפשרויות ולאישורים שהוגדרו במכשיר או באפליקציה.‏\u003c/p\u003e\u003cp\u003e\u003cstrong\u003e5. עוגיות וטכנולוגיות דומות\u003c/strong\u003e\u003c/p\u003e\u003cp\u003eהפלטפורמות עשויות לעשות שימוש בקובצי Cookies ובטכנולוגיות דומות, כגון Pixels, Web Beacons, SDKs וכלים טכנולוגיים נוספים, אשר עשויים להישמר על גבי מכשיר הקצה שלך או לפעול דרכו בעת הגלישה והשימוש בפלטפורמות. טכנולוגיות אלה מאפשרות, בין היתר, לזהות את מכשירך, לשמור מידע הנוגע לאופן השימוש בפלטפורמות, להקל על חוויית השימוש, לאסוף מידע טכני וסטטיסטי, ולתמוך בתפעולן השוטף של הפלטפורמות.\u003c/p\u003e\u003cp\u003eעוגיות הן, ככלל, קובצי טקסט קטנים או רכיבים טכנולוגיים דומים, אשר הדפדפן או המכשיר שלך יוצרים לפי הוראת הפלטפורמה או לפי הוראת צדדים שלישיים שרכיביהם מוטמעים בה. חלק מהעוגיות פוקעות עם סיום הגלישה או סגירת הדפדפן, ואחרות נשמרות על גבי המכשיר גם לאחר מכן, לתקופות משתנות. מבלי לגרוע מהאמור, ייתכן כי בפלטפורמות ישולבו גם רכיבים, תכנים, שירותים או כלים של צדדים שלישיים, אשר עושים אף הם שימוש בעוגיות או בטכנולוגיות דומות. במקרים אלה, איסוף המידע והשימוש בו עשויים להיות כפופים גם למדיניות הפרטיות ולתנאי השימוש של אותם צדדים שלישיים, ולחברה אין שליטה מלאה על אופן פעולתם.\u003c/p\u003e\u003cp\u003eבאפשרותך, בכפוף ליכולות מכשיר הקצה או הדפדפן שבו אתה משתמש, לשנות את הגדרות העוגיות, לחסום אותן, למחוק אותן או להגביל את השימוש בהן. עם זאת, נטרול או מחיקה של עוגיות עלולים להשפיע על חוויית השימוש בפלטפורמות, לגרוע מזמינותן של פונקציות מסוימות, או לפגוע ביכולת לעשות שימוש בחלק מן השירותים.\u003c/p\u003e\u003cp\u003eהמשך השימוש בפלטפורמות מהווה הסכמה לשימוש בעוגיות ובטכנולוגיות דומות, כמפורט במדיניות פרטיות זו, אלא אם שינית את הגדרות מכשירך או הדפדפן שלך באופן המגביל שימוש כאמור.\u003c/p\u003e\u003cp\u003e\u003cstrong\u003e6. מסירת מידע לצדדים שלישיים\u003c/strong\u003e\u003c/p\u003e\u003cp\u003eהחברה לא תמסור מידע אישי אודותיך לצדדים שלישיים, אלא במקרים המותרים לפי דין ו/או במקרים המפורטים במדיניות זו.‏\u003c/p\u003e\u003cp\u003eמבלי לגרוע מהאמור, החברה עשויה להעביר מידע לצדדים שלישיים הפועלים מטעמה או עבורה, ככל שהדבר דרוש לצורך תפעול הפלטפורמות, אספקת השירותים, ניהול מערכות מידע, אחסון, סליקה, דיוור, שירות לקוחות, מדידה, אנליטיקה, פרסום, אבטחת מידע, תחזוקה, או כל שירות תפעולי ועסקי אחר הקשור בפעילותה.‏\u003c/p\u003e\u003cp\u003eהחברה עשויה גם להעביר מידע אם תהיה מחויבת לכך לפי דין, לפי צו שיפוטי, לפי דרישת רשות מוסמכת, לצורך ניהול מחלוקת, תביעה או הליך משפטי, לצורך הגנה על זכויותיה, נכסיה או ענייניה, לצורך מניעת תרמית, פגיעה או שימוש בלתי חוקי, או במקרה של שינוי במבנה החברה, מיזוג, רכישה, מכירת פעילות או העברת נכסים.\u003c/p\u003e\u003cp\u003eבנוסף, החברה תהיה רשאית להעביר לצדדים שלישיים מידע סטטיסטי, אגרגטיבי ו/או אנונימי, שאין בו, כשלעצמו, כדי לזהות אותך באופן אישי. מבלי לגרוע מהאמור, להלן הצדדים השלישיים העיקריים שרכיבים שלהם מוטמעים בפלטפורמות:\u003c/p\u003e\u003cp\u003e\u003cstrong\u003eשםתפקידקישור למדיניות הפרטיות\u003c/strong\u003e\u003ci\u003eבהתאם לכך יש למלא את הטבלה למעלה ביחס לספקים עיקריים/מהותיים. בעמודת שם הספק יש לציין את שם המוצר או החברה כפי שמוכר לציבור (לדוגמה: Google Analytics, Meta Pixel, Taboola, Mailchimp); בעמודת תפקיד יש לציין את פעילות הספק בפלטפורמה, לדוגמה: ספק דיוור, אחסון ענן, ניתוח נתונים ואנליטיקה, פרסום ממוקד, וכד'; בעמודת קישור למדיניות פרטיות יש לציין את הקישור הרשמי של הספק למדיניות הפרטיות שלו\u003c/i\u003e\u003cstrong\u003e7. העברת מידע מחוץ לישראל\u003c/strong\u003e\u003c/p\u003e\u003cp\u003eייתכן שמידע אישי יישמר, יעובד או יועבר מחוץ לגבולות מדינת ישראל, לרבות באמצעות שירותי ענן, שרתים, ספקים טכנולוגיים או מערכות של צדדים שלישיים. במקרים כאלה, החברה תפעל בהתאם להוראות הדין החלות עליה, ותנקוט אמצעים סבירים ומקובלים לשם שמירה על רמת הגנה נאותה ביחס למידע.\u003c/p\u003e\u003cp\u003e\u003cstrong\u003e8. אבטחת מידע\u003c/strong\u003e\u003c/p\u003e\u003cp\u003eהחברה מייחסת חשיבות לאבטחת המידע האישי של משתמשיה ונוקטת אמצעים, מערכות ונהלים מקובלים וסבירים שנועדו לסייע בהגנה על המידע ולצמצם סיכונים של אובדן, שימוש בלתי מורשה, חשיפה, שינוי, מחיקה, פגיעה או גישה בלתי מורשית.\u003c/p\u003e\u003cp\u003eעם זאת, אין אפשרות להבטיח חסינות מוחלטת של מערכות מידע, אתרים, אפליקציות, שרתים או תקשורת נתונים, ולפיכך החברה אינה יכולה להבטיח שהפלטפורמות יהיו חסינות לחלוטין מפני חדירה, שיבוש, כשל, גישה בלתי מורשית או חשיפה של מידע. בשימושך בפלטפורמות אתה מודע למגבלות אלה.\u003c/p\u003e\u003cp\u003e\u003cstrong\u003e9. תקופת שמירת המידע\u003c/strong\u003e\u003c/p\u003e\u003cp\u003eהחברה תשמור את המידע האישי למשך התקופה הנחוצה לצורך המטרות שלשמן נאסף, לצורך מתן השירותים, ניהול הקשר עמך, תיעוד, טיפול בפניות, עמידה בדרישות הדין, ניהול הליכים, הגנה על זכויות החברה, וכן לכל תקופה נוספת המותרת או הנדרשת לפי דין.‏\u003c/p\u003e\u003cp\u003eמבלי לגרוע מהאמור, מידע מסוים עשוי להישמר גם לאחר סיום הקשר עם המשתמש, ככל שהדבר דרוש לצורכי ארכוב, תיעוד, בקרה, מניעת תרמית, התגוננות משפטית, עמידה בדרישות רגולטוריות, או מימוש זכויות החברה.‏\u003c/p\u003e\u003cp\u003e\u003cstrong\u003e10. קישורים, שירותים ותכנים של צדדים שלישיים\u003c/strong\u003e\u003c/p\u003e\u003cp\u003eהפלטפורמות עשויות לכלול קישורים, הפניות, תוספים, רכיבים, שירותים, ממשקים או תכנים של צדדים שלישיים. כל שימוש באתרים, אפליקציות, שירותים או פלטפורמות של צדדים שלישיים כאמור נעשה באחריות המשתמש בלבד, והוא כפוף לתנאי השימוש ולמדיניות הפרטיות של אותם צדדים שלישיים.\u003c/p\u003e\u003cp\u003eהחברה אינה אחראית לנוהלי הפרטיות, לאבטחת המידע, לתכנים, לזמינות או לפעילות של צדדים שלישיים כאמור, ומומלץ לעיין במדיניות הפרטיות שלהם בטרם תעשה בהם שימוש או תמסור להם מידע.‏\u003c/p\u003e\u003cp\u003e\u003cstrong\u003e11. זכויותיך ביחס למידע\u003c/strong\u003e\u003c/p\u003e\u003cp\u003eבהתאם להוראות הדין, ייתכן שעומדות לך זכויות לעיין במידע אישי המוחזק אודותיך במאגרי החברה, לבקש לתקן מידע שאינו נכון, שלם, ברור או מעודכן, ובמקרים המתאימים גם לבקש את מחיקתו או להגיש בקשה אחרת בקשר לשימוש שנעשה בו, והכל בכפוף להוראות הדין החל.‏\u003c/p\u003e\u003cp\u003eככל שהמידע משמש לצורך פנייה אישית אליך על בסיס השתייכות לקבוצת אוכלוסין, ייתכן שתעמוד לך גם הזכות לבקש את מחיקת המידע ממאגר המשמש לדיוור ישיר, בהתאם להוראות הדין.‏\u003c/p\u003e\u003cp\u003eלצורך מימוש זכויותיך, ניתן לפנות לחברה בפרטי הקשר המפורטים להלן, והחברה תטפל בפנייתך בהתאם לדין.\u003c/p\u003e\u003cp\u003e\u003cstrong\u003e12. שינויים במדיניות הפרטיות\u003c/strong\u003e\u003c/p\u003e\u003cp\u003eהחברה רשאית לעדכן מעת לעת את מדיניות הפרטיות, לפי שיקול דעתה ובהתאם לצורך, לרבות עקב שינויים בפלטפורמות, בשירותים, בטכנולוגיה, במודל הפעילות, בדרישות הדין או בנוהגי העבודה של החברה.‏ הנוסח המעודכן של המדיניות כפי שיפורסם בפלטפורמות הוא הנוסח המחייב. ככל שייערכו שינויים מהותיים, החברה תהיה רשאית לפרסם הודעה מתאימה, לפי שיקול דעתה ובכפוף לדין החל.\u003c/p\u003e\u003cp\u003e\u003cstrong\u003e13. יצירת קשר\u003c/strong\u003e\u003c/p\u003e\u003cp\u003eבכל שאלה, בקשה או פנייה הנוגעת למדיניות פרטיות זו או למידע אישי הנוגע אליך,
